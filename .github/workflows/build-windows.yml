name: Build Windows exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build GUI exe
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "往来重分类分析工具" \
            --hidden-import tkinterdnd2 \
            reclass_entry.py

      - name: Build CLI exe
        shell: bash
        run: |
          pyinstaller --onefile --console --name "往来重分类分析工具-cli" \
            --exclude-module tkinterdnd2 \
            reclass_entry.py

      - name: Verify artifacts
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/往来重分类分析工具.exe" && echo "GUI exe OK"
          test -f "dist/往来重分类分析工具-cli.exe" && echo "CLI exe OK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wanglai-reclass-windows-exe
          path: |
            dist/往来重分类分析工具.exe
            dist/往来重分类分析工具-cli.exe
          if-no-files-found: error
